name: pages
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: website/go.mod
          cache-dependency-path: website/go.sum
      - name: Build website
        working-directory: website
        # The builder derives the /boardchestrator/ base path from site.yaml
        # and exits non-zero on any broken internal link.
        run: |
          go build -o /tmp/bc-site .
          /tmp/bc-site build -root .
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
