name: lint
on:
  pull_request:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go mod download
      - name: templ generate check
        run: |
          go run github.com/a-h/templ/cmd/templ@v0.3.1001 generate
          git diff --exit-code -- '*_templ.go' || { echo "templ output out of date"; exit 1; }
      - name: gofmt
        run: |
          gofmt -d -l . | awk '{print} END{exit NR>0}'
      - name: golangci-lint
        # Pinned, never `latest`: a floating version is what broke this job
        # when golangci-lint v2 shipped and rejected the old v1-format
        # config. Action v7+ is golangci-lint-v2-only; v9 requires >= v2.1.0.
        # Keep this version in step with the Makefile (WU-545).
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
