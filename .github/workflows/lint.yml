name: lint
on:
  pull_request:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go mod download
      - name: templ generate check
        run: |
          go run github.com/a-h/templ/cmd/templ@v0.3.1001 generate
          git diff --exit-code -- '*_templ.go' || { echo "templ output out of date"; exit 1; }
      - name: gofmt
        run: |
          gofmt -d -l . | awk '{print} END{exit NR>0}'
      - name: golangci-lint
        # Pinned, not `latest`. golangci-lint v2 requires `version: "2"` in
        # .golangci.yml and rejects this repo's v1-format config outright
        # ("unsupported version of the configuration"), so `latest` broke CI
        # the moment v2 shipped. Same reasoning as the pinned sqlc/templ
        # versions in the Makefile. Migrating to v2 is WU-547.
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
