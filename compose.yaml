# Boardchestrator — docker compose (WU-508 release readiness).
# Run:  docker compose up --build -d
# Smoke: docker compose exec bc /usr/local/bin/bc smoke  (see scripts/smoke.sh)
#
# Secrets must come from your environment / a .env file — never commit real
# values. BC_SECRET_KEY and BC_SESSION_SECRET are required (config validation).
services:
  bc:
    image: boardchestrator:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      BC_DB_PATH: /data/bc.db
      BC_DATA_DIR: /data
      BC_BASE_URL: http://localhost:8080
      BC_BIND: 0.0.0.0:8080
      BC_SECRET_KEY: ${BC_SECRET_KEY:?set BC_SECRET_KEY in .env}
      BC_SESSION_SECRET: ${BC_SESSION_SECRET:?set BC_SESSION_SECRET in .env}
      BC_GOOGLE_CLIENT_ID: ${BC_GOOGLE_CLIENT_ID:-dev-client-id}
      BC_GOOGLE_CLIENT_SECRET: ${BC_GOOGLE_CLIENT_SECRET:-dev-client-secret}
      BC_AGENT_WORKERS: "4"
      BC_SCHED_POLL_INTERVAL: "60"
    volumes:
      - bc-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  bc-data:
