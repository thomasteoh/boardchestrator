version: "2"
sql:
  - engine: "sqlite"
    schema: "migrations/schema.sql"
    queries: "internal/db/queries"
    gen:
      go:
        package: "sqlc"
        out: "internal/db/sqlc"
  - engine: "sqlite"
    schema: "internal/db/schema/wiki/schema.sql"
    queries: "internal/db/queries/wiki"
    gen:
      go:
        package: "wikidb"
        out: "internal/db/sqlc/wiki"
